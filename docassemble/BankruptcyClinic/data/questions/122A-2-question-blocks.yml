# Official Form 122A-2 - Chapter 7 Means Test Calculation (revision 04/25).
#
# This form is only filed when Form 122A-1 line 14b applies: annualised current
# monthly income is MORE than the DOJ median family income for the state and
# household size. The mandatory block in voluntary-petition.yml decides that and
# gates every screen below on `means_test_long_form_required`.
#
# Every IRS National / Local Standard figure comes from
# docassemble/BankruptcyClinic/means_test_data.py, which is generated by
# scripts/fetch_means_test_data.py from the published U.S. Trustee Program
# tables. Do not retype a standard amount here.
---
# Form line 2. Column B of Form 122A-1 is filled in whenever the interview
# collected the Debtor 2 / spouse income screen. Same condition the mandatory
# block uses before it collects monthly_income.gross_wages2, mirrored here.
code: |
  means2_column_b = (
      monthly_income.filing_status == "Married and your spouse is filing with you."
      or (monthly_income.filing_status == "Married and your spouse is NOT filing with you."
          and getattr(monthly_income, 'separated_status', '')
              != 'Living separately or are legally separated'))
---
# Form line 3 can only be non-zero for a married filer whose spouse is NOT
# filing with them. Line 2 says: if your spouse is filing with you, fill in $0
# for the total on line 3.
code: |
  means2_marital_adjustment_applies = (
      means2_column_b
      and monthly_income.filing_status
          == "Married and your spouse is NOT filing with you.")
---
id: means2 marital adjustment
section: form_122a
question: |
  Your spouse's income that is not used for your household
subquestion: |
  You reported your spouse's income even though your spouse is not filing with
  you. The means test lets you subtract any part of that income that is **not**
  regularly used for the household expenses of you or your dependants - for
  example, income your spouse uses to pay their own tax debt or to support
  someone else.

  If all of your spouse's income goes to your household, answer No.
fields:
  - Was any of your spouse's income NOT regularly used for the household expenses of you or your dependants?: means2.spouse_income_not_shared
    datatype: yesnoradio
  - note: |
      State each purpose the income was used for, and the amount you subtract.
    show if: means2.spouse_income_not_shared
  - Purpose: means2.marital_purpose1
    required: False
    show if: means2.spouse_income_not_shared
  - Amount: means2.marital_amount1
    datatype: currency
    required: False
    show if: means2.spouse_income_not_shared
  - Purpose: means2.marital_purpose2
    required: False
    show if: means2.spouse_income_not_shared
  - Amount: means2.marital_amount2
    datatype: currency
    required: False
    show if: means2.spouse_income_not_shared
  - Purpose: means2.marital_purpose3
    required: False
    show if: means2.spouse_income_not_shared
  - Amount: means2.marital_amount3
    datatype: currency
    required: False
    show if: means2.spouse_income_not_shared
---
id: means2 household size
section: form_122a
question: |
  How many people count toward your expense deductions?
subquestion: |
  Line 5 of the form asks for the number of people you could claim as exemptions
  on your federal income tax return, plus any other dependants you support.
  **This number can be different from the number of people in your household.**

  Lines 7b and 7e split that number by age, because the IRS allows a larger
  out-of-pocket health care amount for people 65 and older. The two age counts
  should add up to the number above.
fields:
  - Number of people used in determining your deductions: means2.exemption_people
    datatype: integer
    min: 1
  - Of those, how many are under 65 years of age?: means2.people_under_65
    datatype: integer
    min: 0
  - Of those, how many are 65 years of age or older?: means2.people_65_plus
    datatype: integer
    min: 0
    default: 0
---
id: means2 housing
section: form_122a
question: |
  Your home mortgage or rent payments
subquestion: |
  We looked up the IRS Local Standard for housing and utilities in
  ${ means2_county_display }, ${ means2_state_display } for
  ${ means2.exemption_people } ${ 'person' if means2.exemption_people == 1 else 'people' }:

  * Insurance and operating expenses (line 8): **${ currency(means2_housing_operating) }**
  * Mortgage or rent expenses (line 9a): **${ currency(means2_housing_mortgage) }**

  Line 9b asks for the average monthly payment on every debt secured by your
  home. To work that out, add everything you are contractually due to pay each
  secured creditor over the 60 months after you file, then divide by 60. If you
  rent, leave line 9b blank.
fields:
  - Creditor: means2.home_creditor1
    required: False
  - Average monthly payment: means2.home_payment1
    datatype: currency
    required: False
  - Creditor: means2.home_creditor2
    required: False
  - Average monthly payment: means2.home_payment2
    datatype: currency
    required: False
  - Creditor: means2.home_creditor3
    required: False
  - Average monthly payment: means2.home_payment3
    datatype: currency
    required: False
  - note: |
      Line 10. Most filers leave this at $0. Fill it in only if you claim the
      U.S. Trustee Program's split of the IRS housing standard is wrong for you.
  - Additional housing amount you claim: means2.housing_adjustment
    datatype: currency
    default: 0
  - Explain why: means2.housing_adjustment_explain
    required: False
---
id: means2 vehicle count
section: form_122a
question: |
  How many vehicles do you claim an ownership or operating expense for?
subquestion: |
  Line 11. You may not claim the expense for more than two vehicles, and you may
  not claim an ownership expense for a vehicle you make no loan or lease
  payments on.
fields:
  - Number of vehicles: means2.vehicle_count
    choices:
      - "0"
      - "1"
      - "2 or more"
---
id: means2 vehicle details
section: form_122a
question: |
  Your vehicle loan or lease payments
subquestion: |
  We looked up the IRS Local Standards for you:

  * Vehicle operating cost (line 12): **${ currency(means2_vehicle_operating) }**
  * Ownership or leasing cost, per vehicle (line 13a): **${ currency(means2_vehicle_ownership) }**

  Line 13b asks for the average monthly payment on every debt secured by this
  vehicle. Add everything contractually due to each secured creditor over the 60
  months after you file, then divide by 60. **Do not enter a leased vehicle's
  costs here.**
fields:
  - Describe Vehicle 1: means2.vehicle1_description
  - Name of creditor for Vehicle 1: means2.vehicle1_creditor1
    required: False
  - Average monthly payment: means2.vehicle1_payment1
    datatype: currency
    required: False
  - Name of another creditor for Vehicle 1: means2.vehicle1_creditor2
    required: False
  - Average monthly payment: means2.vehicle1_payment2
    datatype: currency
    required: False
  - note: |
      Line 15. If you also pay for public transportation, you may claim it here,
      up to the IRS Local Standard of
      ${ currency(means2_public_transportation_standard) } a month.
  - Additional public transportation expense: means2.additional_public_transportation
    datatype: currency
    default: 0
---
id: means2 vehicle 2 details
section: form_122a
question: |
  Your second vehicle's loan or lease payments
subquestion: |
  Lines 13d to 13f. The IRS ownership or leasing cost for this vehicle is
  **${ currency(means2_vehicle2_ownership) }**.
fields:
  - Describe Vehicle 2: means2.vehicle2_description
  - Name of creditor for Vehicle 2: means2.vehicle2_creditor1
    required: False
  - Average monthly payment: means2.vehicle2_payment1
    datatype: currency
    required: False
  - Name of another creditor for Vehicle 2: means2.vehicle2_creditor2
    required: False
  - Average monthly payment: means2.vehicle2_payment2
    datatype: currency
    required: False
---
id: means2 other necessary expenses
section: form_122a
question: |
  Other necessary monthly expenses
subquestion: |
  Lines 16 to 23. These are your **actual** average monthly amounts, not IRS
  standards. Where we could, we filled them in from your Schedule I and
  Schedule J answers. Check each one and correct it.
fields:
  - "16. Taxes you actually owe each month - income, self-employment, Social Security and Medicare. Subtract one twelfth of any refund you expect. Do not include real estate, sales or use taxes.": means2.taxes
    datatype: currency
    default: ${ means2_default_taxes }
  - "17. Involuntary payroll deductions your job requires - retirement contributions, union dues, uniform costs. Do not include voluntary 401(k) or payroll savings.": means2.involuntary_deductions
    datatype: currency
    default: ${ means2_default_involuntary }
  - "18. Term life insurance premiums for yourself, and for your spouse if filing together. Do not include cover on dependants or any policy that is not term life.": means2.life_insurance
    datatype: currency
    default: ${ means2_default_life_insurance }
  - "19. Court-ordered payments such as spousal or child support. Do not include past-due amounts - those go on line 35.": means2.court_ordered
    datatype: currency
    default: ${ means2_default_court_ordered }
  - "20. Education required for your job, or for a physically or mentally challenged dependent child where no public education is available.": means2.education
    datatype: currency
    default: 0
  - "21. Childcare - babysitting, daycare, nursery, preschool. Do not include elementary or secondary school fees.": means2.childcare
    datatype: currency
    default: ${ means2_default_childcare }
  - "22. Health care you pay for that insurance does not reimburse, over and above the ${ currency(means2_oop_total) } already allowed on line 7. Do not include insurance premiums or health savings accounts - those go on line 25.": means2.additional_health_care
    datatype: currency
    default: 0
  - "23. Optional telephone services - pagers, call waiting, caller ID, business cell service - needed for your health and welfare or to produce income. Do not include basic home phone, internet or cell service.": means2.optional_telephone
    datatype: currency
    default: 0
---
id: means2 health insurance
section: form_122a
question: |
  Health insurance, disability insurance, and health savings accounts
subquestion: |
  Line 25. Enter what is reasonably necessary for you, your spouse, or your
  dependants.
fields:
  - Health insurance: means2.health_insurance
    datatype: currency
    default: ${ means2_default_health_insurance }
  - Disability insurance: means2.disability_insurance
    datatype: currency
    default: 0
  - Health savings account: means2.health_savings
    datatype: currency
    default: 0
  - Do you actually spend this total amount?: means2.actually_spend_health
    datatype: yesnoradio
  - How much do you actually spend?: means2.actual_health_spend
    datatype: currency
    required: False
    show if:
      variable: means2.actually_spend_health
      is: False
---
id: means2 additional deductions
section: form_122a
question: |
  Additional expense deductions
subquestion: |
  Lines 26 to 31. Do not repeat anything you already entered on lines 6 to 24.
  Most filers leave most of these at $0.
fields:
  - "26. Continuing care of an elderly, chronically ill, or disabled member of your household or immediate family who cannot pay for it themselves.": means2.family_care
    datatype: currency
    default: 0
  - "27. Protection against family violence under the Family Violence Prevention and Services Act or other federal law. The court keeps the nature of these expenses confidential.": means2.family_violence
    datatype: currency
    default: 0
  - "28. Home energy costs above what the line 8 insurance and operating allowance covers. You must document these for the trustee.": means2.home_energy
    datatype: currency
    default: 0
  - "29. Private or public elementary or secondary school for your dependent children under 18, up to $214.58 per child per month. You must document these and explain why they are reasonable.": means2.school_expenses
    datatype: currency
    default: 0
  - "30. Food and clothing you actually spend above the IRS National Standard, up to 5% of that standard (${ currency(means2_food_clothing_cap) } a month).": means2.additional_food_clothing
    datatype: currency
    default: 0
  - "31. Continuing charitable contributions to a religious or charitable organisation.": means2.charitable
    datatype: currency
    default: ${ means2_default_charitable }
---
