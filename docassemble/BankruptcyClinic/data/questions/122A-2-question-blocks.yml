  means2_line['25health'] = float(means2.health_insurance)
  means2_line['25disability'] = float(means2.disability_insurance)
  means2_line['25hsa'] = float(means2.health_savings)
  means2_line['25'] = (means2_line['25health'] + means2_line['25disability']
