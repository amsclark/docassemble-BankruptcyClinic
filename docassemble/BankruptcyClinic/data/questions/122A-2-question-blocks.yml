---
# --- Derived values the screens above display -----------------------------
code: |
  means2_state_display = getattr(debtor[0].address, 'state', '')
---
code: |
  means2_county_display = getattr(debtor[0].address, 'county', '')
---
code: |
  means2_housing_operating, means2_housing_mortgage = get_housing_standards(
      means2_state_display, means2_county_display, means2.exemption_people)
---
code: |
  means2_oop_total = get_oop_healthcare(
      means2.people_under_65, means2.people_65_plus)[4]
---
# Line 30's ceiling is 5 per cent of the IRS National Standard, which is what
# line 6 uses.
code: |
  means2_food_clothing_cap = round(
      get_national_standard(means2.exemption_people) * 0.05, 2)
---
code: |
  means2_vehicle_count_number = 0
  if means2.vehicle_count == '1':
    means2_vehicle_count_number = 1
  elif means2.vehicle_count == '2 or more':
    means2_vehicle_count_number = 2
---
code: |
  if means2_vehicle_count_number >= 1:
    means2_vehicle_operating = get_vehicle_operating_cost(means2_vehicle_count_number)
  else:
    means2_vehicle_operating = 0
---
# Lines 13a and 13d are claimed one vehicle at a time, so each takes the
# single-vehicle IRS ownership figure.
code: |
  if means2_vehicle_count_number >= 1:
    means2_vehicle_ownership = get_vehicle_ownership_cost(1)
  else:
    means2_vehicle_ownership = 0
---
code: |
  if means2_vehicle_count_number >= 2:
    means2_vehicle2_ownership = get_vehicle_ownership_cost(1)
  else:
    means2_vehicle2_ownership = 0
---
code: |
  means2_public_transportation_standard = get_public_transportation_cost()
---
code: |
  means2_ch13_multiplier = get_ch13_multiplier(means2_state_display)
---
code: |
  means2_ch13_multiplier_display = round(means2_ch13_multiplier * 100, 1)
---
code: |
  means2_threshold_low = MEANS_TEST_THRESHOLD_LOW
---
code: |
  means2_threshold_high = MEANS_TEST_THRESHOLD_HIGH
---
# --- Defaults pulled from Schedule I / Schedule J answers -----------------
code: |
  means2_default_taxes = getattr(debtor[0].income, 'tax_deduction', 0) or 0
---
code: |
  means2_default_involuntary = ((getattr(debtor[0].income, 'mandatory_contributions', 0) or 0)
                                + (getattr(debtor[0].income, 'union_dues', 0) or 0))
---
code: |
  means2_default_life_insurance = getattr(debtor[0].expenses, 'life_insurance', 0) or 0
---
code: |
  means2_default_court_ordered = getattr(debtor[0].expenses, 'alimony', 0) or 0
---
code: |
  means2_default_childcare = getattr(debtor[0].expenses, 'childcare', 0) or 0
---
code: |
  means2_default_health_insurance = getattr(debtor[0].expenses, 'health_insurance', 0) or 0
---
code: |
  means2_default_charitable = getattr(debtor[0].expenses, 'charity', 0) or 0
---
# Line 41a default: the Schedule E/F part 2 total, the same figure Form 106Sum
# line 3b prints.
code: |
  _m2_np_total = 0.0
  for _m2_npc in prop.nonpriority_claims:
    _m2_np_total += float(getattr(_m2_npc, 'total_claim', 0) or 0)
  means2_nonpriority_default = round(_m2_np_total, 2)
---
# --- The line-by-line calculation -----------------------------------------
# Every read of a screen field that sits behind a `show if` uses a literal
# three-argument getattr, so the value is defined even when the field was
# hidden (interview rule 4).
code: |
  means2_line = {}

  # --- Part 1: adjusted current monthly income --------------------------
  means2_line['1'] = float(overall_means_income)

  if means2_marital_adjustment_applies and getattr(means2, 'spouse_income_not_shared', False):
    means2_line['3'] = (float(getattr(means2, 'marital_amount1', 0) or 0)
                        + float(getattr(means2, 'marital_amount2', 0) or 0)
                        + float(getattr(means2, 'marital_amount3', 0) or 0))
  else:
    means2_line['3'] = 0.0
  means2_line['4'] = means2_line['1'] - means2_line['3']

  # --- Part 2: expense deductions ---------------------------------------
  means2_line['5'] = int(means2.exemption_people)
  means2_line['6'] = float(get_national_standard(means2.exemption_people))

  _m2_oop = get_oop_healthcare(means2.people_under_65, means2.people_65_plus)
  means2_line['7a'] = float(_m2_oop[0])
  means2_line['7b'] = int(means2.people_under_65)
  means2_line['7c'] = float(_m2_oop[1])
  means2_line['7d'] = float(_m2_oop[2])
  means2_line['7e'] = int(means2.people_65_plus)
  means2_line['7f'] = float(_m2_oop[3])
  means2_line['7g'] = float(_m2_oop[4])

  means2_line['8'] = float(means2_housing_operating)
  means2_line['9a'] = float(means2_housing_mortgage)
  means2_line['9b'] = (float(getattr(means2, 'home_payment1', 0) or 0)
                       + float(getattr(means2, 'home_payment2', 0) or 0)
                       + float(getattr(means2, 'home_payment3', 0) or 0))
  means2_line['9c'] = max(0.0, means2_line['9a'] - means2_line['9b'])
  means2_line['10'] = float(getattr(means2, 'housing_adjustment', 0) or 0)

  means2_line['11'] = means2_vehicle_count_number
  means2_line['12'] = float(means2_vehicle_operating)

  means2_line['13a'] = float(means2_vehicle_ownership)
  if means2_vehicle_count_number >= 1:
    means2_line['13b'] = (float(getattr(means2, 'vehicle1_payment1', 0) or 0)
                          + float(getattr(means2, 'vehicle1_payment2', 0) or 0))
  else:
    means2_line['13b'] = 0.0
  means2_line['13c'] = max(0.0, means2_line['13a'] - means2_line['13b'])

  means2_line['13d'] = float(means2_vehicle2_ownership)
  if means2_vehicle_count_number >= 2:
    means2_line['13e'] = (float(getattr(means2, 'vehicle2_payment1', 0) or 0)
                          + float(getattr(means2, 'vehicle2_payment2', 0) or 0))
  else:
    means2_line['13e'] = 0.0
  means2_line['13f'] = max(0.0, means2_line['13d'] - means2_line['13e'])

  # Line 14 is the public transportation allowance for a filer who claims NO
  # vehicle. Line 15 is the extra a filer WITH a vehicle may claim, capped at
  # the same IRS Local Standard.
  if means2_vehicle_count_number == 0:
