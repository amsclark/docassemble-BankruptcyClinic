    means2_line['34total2'] = 0.0
    means2_line['34total3'] = 0.0
  means2_line['34monthly1'] = means2_line['34total1'] / 60.0
  means2_line['34monthly2'] = means2_line['34total2'] / 60.0
  means2_line['34monthly3'] = means2_line['34total3'] / 60.0
  means2_line['34'] = (means2_line['34monthly1'] + means2_line['34monthly2']
                       + means2_line['34monthly3'])

  if getattr(means2, 'has_priority_claims', False):
    means2_line['35total'] = float(getattr(means2, 'priority_claims_total', 0) or 0)
  else:
    means2_line['35total'] = 0.0
  means2_line['35'] = means2_line['35total'] / 60.0

  if getattr(means2, 'chapter13_eligible', False):
    means2_line['36payment'] = float(getattr(means2, 'chapter13_plan_payment', 0) or 0)
  else:
