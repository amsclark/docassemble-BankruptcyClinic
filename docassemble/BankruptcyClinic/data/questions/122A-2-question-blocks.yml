  means2_line['36'] = means2_line['36payment'] * means2_line['36multiplier']

  means2_line['37'] = (means2_line['33e'] + means2_line['34']
                       + means2_line['35'] + means2_line['36'])
  means2_line['38'] = means2_line['24'] + means2_line['32'] + means2_line['37']

  # --- Part 3: presumption of abuse -------------------------------------
  means2_line['39a'] = means2_line['4']
  means2_line['39b'] = means2_line['38']
  means2_line['39c'] = means2_line['39a'] - means2_line['39b']
  means2_line['39d'] = means2_line['39c'] * 60.0

  means2_line['40'] = presumption_of_abuse(means2_line['39d'])

  means2_line['41a'] = float(means2.nonpriority_unsecured_total)
  means2_line['41b'] = means2_line['41a'] * 0.25

  # Line 42 is reached only when line 40 lands between the two statutory
  # thresholds. Outside that band line 40 settles the question.
  if means2_line['40'] == 'check_line_41':
    if means2_line['39d'] < means2_line['41b']:
      means2_line['42'] = 'none'
    else:
      means2_line['42'] = 'presumed'
    means2_line['presumption'] = means2_line['42']
  else:
    means2_line['42'] = ''
    means2_line['presumption'] = means2_line['40']
