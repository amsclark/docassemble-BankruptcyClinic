  means2_line['16'] = float(means2.taxes)
  means2_line['17'] = float(means2.involuntary_deductions)
  means2_line['18'] = float(means2.life_insurance)
  means2_line['19'] = float(means2.court_ordered)
  means2_line['20'] = float(means2.education)
  means2_line['21'] = float(means2.childcare)
  means2_line['22'] = float(means2.additional_health_care)
  means2_line['23'] = float(means2.optional_telephone)

  means2_line['24'] = (means2_line['6'] + means2_line['7g'] + means2_line['8']
                       + means2_line['9c'] + means2_line['10']
                       + means2_line['12'] + means2_line['13c']
                       + means2_line['13f'] + means2_line['14']
                       + means2_line['15'] + means2_line['16']
                       + means2_line['17'] + means2_line['18']
                       + means2_line['19'] + means2_line['20']
                       + means2_line['21'] + means2_line['22']
                       + means2_line['23'])

